<!DOCTYPE html>
<html>
<head>

<title>Internet Protocol Observation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#A8EDEA,#FED6E3,#FFF5BA,#C7F9CC);
    padding:40px;
}

.container{
    width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0px 12px 25px rgba(0,0,0,0.25);
}

.header{
    background:linear-gradient(to right,#11998E,#38EF7D);
    color:white;
    text-align:center;
    padding:30px;
}

.header h1{
    font-size:38px;
}

.header p{
    margin-top:10px;
    font-size:18px;
}

.section{
    text-align:center;
    padding:30px;
}

h2{
    color:#0D47A1;
    margin-bottom:15px;
}

img{
    width:420px;
    height:260px;
    border-radius:15px;
    border:5px solid #00ACC1;
    box-shadow:0px 8px 20px rgba(0,0,0,0.25);
}

a{
    display:inline-block;
    margin-top:20px;
    background:#1565C0;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border-radius:30px;
    font-size:18px;
    transition:0.4s;
}

a:hover{
    background:#0D47A1;
    transform:scale(1.08);
}

iframe{
    width:90%;
    height:350px;
    border:5px solid #26A69A;
    border-radius:15px;
    margin-top:20px;
}

.footer{
    background:#11998E;
    color:white;
    text-align:center;
    padding:18px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>Internet Protocol Observation</h1>
<p>Using Browser Developer Tools (Network Tab)</p>
</div>

<div class="section">

<h2>Sample Image</h2>

<img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=800"
alt="Computer Network"
width="420"
height="260">

</div>

<div class="section">

<h2>Hyperlink</h2>

<a href="https://www.wikipedia.org" target="_blank">
Open Wikipedia
</a>

</div>

<div class="section">

<h2>Embedded Webpage</h2>

<iframe
src="https://www.wikipedia.org"
title="Wikipedia">
</iframe>

</div>

<div class="footer">
Designed by Gayathri | Web Technology Lab
</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dynamic To-Do List</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#F8F1E7,#F3E5D8,#EFE4D7,#FAF6F0);
}

.container{

width:450px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0px 10px 25px rgba(0,0,0,0.2);

}

h1{

text-align:center;
color:#7A5C4D;
margin-bottom:25px;

}

.input-box{

display:flex;
gap:10px;

}

input{

flex:1;
padding:12px;
font-size:16px;
border:2px solid #D8C3B5;
border-radius:10px;
outline:none;

}

input:focus{

border-color:#B08968;

}

button{

padding:12px 18px;
border:none;
border-radius:10px;
background:#B08968;
color:white;
cursor:pointer;
font-size:16px;
transition:0.3s;

}

button:hover{

background:#8B5E3C;

}

ul{

list-style:none;
margin-top:20px;

}

li{

display:flex;
justify-content:space-between;
align-items:center;
background:#FFF8F2;
padding:12px;
margin-bottom:12px;
border-left:6px solid #B08968;
border-radius:10px;
transition:0.3s;

}

.completed{

text-decoration:line-through;
color:gray;
background:#E8F5E9;

}

.task{

cursor:pointer;
flex:1;

}

.delete{

background:#E74C3C;
padding:8px 12px;
font-size:14px;

}

.delete:hover{

background:#C0392B;

}

.footer{

text-align:center;
margin-top:20px;
color:#777;

}

</style>

</head>

<body>

<div class="container">

<h1>📝 Dynamic To-Do List</h1>

<div class="input-box">

<input
type="text"
id="taskInput"
placeholder="Enter a Task">

<button onclick="addTask()">Add</button>

</div>

<ul id="taskList"></ul>

<div class="footer">

Web Technology Laboratory

</div>

</div>

<script>

function addTask(){

let input=document.getElementById("taskInput");

let task=input.value.trim();

if(task===""){

alert("Please enter a task.");

return;

}

let li=document.createElement("li");

let span=document.createElement("span");

span.innerHTML=task;

span.className="task";

span.onclick=function(){

span.classList.toggle("completed");

};

let del=document.createElement("button");

del.innerHTML="Delete";

del.className="delete";

del.onclick=function(){

li.remove();

};

li.appendChild(span);

li.appendChild(del);

document.getElementById("taskList").appendChild(li);

input.value="";

input.focus();

}

</script>

</body>

</html>

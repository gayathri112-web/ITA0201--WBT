<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Shopping Cart & Billing System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#F8F1E7,#F3E5D8,#EFE4D7,#FAF6F0);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:650px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0px 10px 25px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#7A5C4D;
margin-bottom:25px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
color:#6B4F4F;
}

select,input{
width:100%;
padding:12px;
margin-top:8px;
border:2px solid #D8C3B5;
border-radius:10px;
font-size:16px;
background:#FAF6F2;
}

button{
margin-top:20px;
width:100%;
padding:14px;
font-size:17px;
border:none;
border-radius:10px;
background:#B08968;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#8B5E3C;
}

table{
width:100%;
margin-top:25px;
border-collapse:collapse;
}

table,th,td{
border:1px solid #B08968;
}

th{
background:#B08968;
color:white;
padding:12px;
}

td{
padding:10px;
text-align:center;
}

#bill{
margin-top:25px;
padding:20px;
background:#FFF8F2;
border-left:6px solid #B08968;
border-radius:10px;
font-size:18px;
line-height:2;
}

.footer{
margin-top:20px;
text-align:center;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>🛒 Product Shopping Cart</h1>

<label>Select Product</label>

<select id="product">

<option value="Laptop,50000">Laptop - ₹50,000</option>
<option value="Mobile,20000">Mobile - ₹20,000</option>
<option value="Headphones,2500">Headphones - ₹2,500</option>
<option value="Smart Watch,4000">Smart Watch - ₹4,000</option>

</select>

<label>Quantity</label>

<input
type="number"
id="quantity"
min="1"
value="1">

<button onclick="addProduct()">

Add to Cart

</button>

<table>

<thead>

<tr>

<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>

</tr>

</thead>

<tbody id="cart">

</tbody>

</table>

<div id="bill">

<b>Total Bill : ₹0</b>

</div>

<div class="footer">

Web Technology Laboratory

</div>

</div>

<script>

let grandTotal=0;

function addProduct(){

let product=document.getElementById("product").value.split(",");

let name=product[0];

let price=parseInt(product[1]);

let quantity=parseInt(document.getElementById("quantity").value);

if(quantity<=0){

alert("Enter a valid quantity.");

return;

}

let total=price*quantity;

grandTotal+=total;

let row=document.createElement("tr");

row.innerHTML=

"<td>"+name+"</td>"+

"<td>₹"+price+"</td>"+

"<td>"+quantity+"</td>"+

"<td>₹"+total+"</td>";

document.getElementById("cart").appendChild(row);

let gst=grandTotal*0.18;

let finalBill=grandTotal+gst;

document.getElementById("bill").innerHTML=

"<b>Subtotal :</b> ₹"+grandTotal+

"<br><b>GST (18%) :</b> ₹"+gst.toFixed(2)+

"<br><b>Final Bill :</b> ₹"+finalBill.toFixed(2);

}

</script>

</body>

</html>

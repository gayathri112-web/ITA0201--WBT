<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Quiz Application</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#F8F1E7,#F3E5D8,#EFE4D7,#FAF6F0);
}

.container{

width:650px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0px 10px 25px rgba(0,0,0,0.2);

}

h1{

text-align:center;
color:#7A5C4D;
margin-bottom:25px;

}

.question{

margin-bottom:25px;

}

.question h3{

color:#6B4F4F;
margin-bottom:10px;

}

label{

display:block;
margin:8px 0;
font-size:17px;
cursor:pointer;

}

button{

width:100%;
padding:14px;
background:#B08968;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#8B5E3C;

}

#result{

margin-top:25px;
padding:20px;
background:#FFF8F2;
border-left:6px solid #B08968;
border-radius:10px;
font-size:18px;
font-weight:bold;
text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h1>📝 Online Quiz Application</h1>

<form id="quizForm">

<div class="question">

<h3>1. HTML stands for?</h3>

<label><input type="radio" name="q1" value="a"> Hyper Text Markup Language</label>

<label><input type="radio" name="q1" value="b"> High Text Machine Language</label>

<label><input type="radio" name="q1" value="c"> Hyper Transfer Markup Language</label>

</div>

<div class="question">

<h3>2. Which language is used for styling web pages?</h3>

<label><input type="radio" name="q2" value="a"> HTML</label>

<label><input type="radio" name="q2" value="b"> CSS</label>

<label><input type="radio" name="q2" value="c"> Python</label>

</div>

<div class="question">

<h3>3. Which language is used for client-side scripting?</h3>

<label><input type="radio" name="q3" value="a"> Java</label>

<label><input type="radio" name="q3" value="b"> C++</label>

<label><input type="radio" name="q3" value="c"> JavaScript</label>

</div>

<div class="question">

<h3>4. Which tag is used to insert an image?</h3>

<label><input type="radio" name="q4" value="a"> &lt;img&gt;</label>

<label><input type="radio" name="q4" value="b"> &lt;image&gt;</label>

<label><input type="radio" name="q4" value="c"> &lt;pic&gt;</label>

</div>

<div class="question">

<h3>5. Which symbol is used for an ID selector in CSS?</h3>

<label><input type="radio" name="q5" value="a"> .</label>

<label><input type="radio" name="q5" value="b"> #</label>

<label><input type="radio" name="q5" value="c"> *</label>

</div>

<button type="button" onclick="checkAnswers()">

Submit Quiz

</button>

</form>

<div id="result"></div>

</div>

<script>

function checkAnswers(){

let score=0;

let answers={

q1:"a",
q2:"b",
q3:"c",
q4:"a",
q5:"b"

};

for(let question in answers){

let option=document.querySelector('input[name="'+question+'"]:checked');

if(option && option.value===answers[question]){

score++;

}

}

let percentage=(score/5)*100;

let grade="";

if(percentage>=90)

grade="A+";

else if(percentage>=80)

grade="A";

else if(percentage>=70)

grade="B";

else if(percentage>=60)

grade="C";

else

grade="Needs Improvement";

document.getElementById("result").innerHTML=

"✅ Score : <b>"+score+"/5</b><br><br>"+

"📊 Percentage : <b>"+percentage+"%</b><br><br>"+

"🏆 Grade : <b>"+grade+"</b>";

}

</script>

</body>

</html>

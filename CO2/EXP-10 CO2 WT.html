<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Debugged CSS & JavaScript Web Application</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#F8F1E7,#F3E5D8,#EFE4D7,#FAF6F0);
}

.container{

width:450px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0px 10px 25px rgba(0,0,0,0.2);
text-align:center;

}

h1{

color:#7A5C4D;
margin-bottom:20px;

}

p{

font-size:17px;
color:#555;
margin-bottom:20px;

}

button{

padding:14px 30px;
background:#B08968;
color:white;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
transition:0.3s;

}

button:hover{

background:#8B5E3C;
transform:scale(1.05);

}

#output{

margin-top:25px;
padding:18px;
background:#FFF8F2;
border-left:6px solid #B08968;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:#333;

}

.footer{

margin-top:20px;
color:#777;

}

</style>

</head>

<body>

<div class="container">

<h1>🐞 Debugged CSS & JavaScript Application</h1>

<p>
Click the button below to verify that the CSS styling and JavaScript functionality are working correctly.
</p>

<button onclick="showMessage()">

Click Me

</button>

<div id="output">

Waiting for user action...

</div>

<div class="footer">

Web Technology Laboratory

</div>

</div>

<script>

function showMessage(){

let output=document.getElementById("output");

output.innerHTML="✅ Congratulations! The CSS and JavaScript errors have been successfully debugged.";

output.style.background="#E8F5E9";

output.style.color="green";

output.style.borderLeft="6px solid green";

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scientific Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#F8F1E7,#F5E6DA,#EFE4D7,#FAF6F0);
}

.calculator{

width:360px;
background:#FFFDFB;
padding:25px;
border-radius:20px;
box-shadow:0px 12px 30px rgba(0,0,0,0.15);
border:2px solid #E5D3C5;

}

h2{

text-align:center;
color:#7A5C4D;
margin-bottom:20px;

}

#display{

width:100%;
height:60px;
font-size:24px;
text-align:right;
padding:10px;
border:2px solid #D8C3B5;
border-radius:10px;
background:#FAF6F2;
margin-bottom:20px;

}

.buttons{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;

}

button{

padding:18px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#EADBC8;
transition:.3s;

}

button:hover{

background:#D8BFAA;
transform:scale(1.05);

}

.operator{

background:#B08968;
color:white;

}

.operator:hover{

background:#9C6644;

}

.equal{

background:#6D9773;
color:white;

}

.equal:hover{

background:#4F7942;

}

.clear{

background:#C97C5D;
color:white;

}

.clear:hover{

background:#B5654A;

}

</style>

</head>

<body>

<div class="calculator">

<h2>🧮 Scientific Calculator</h2>

<input type="text" id="display" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">⌫</button>
<button class="operator" onclick="append('%')">%</button>
<button class="operator" onclick="append('/')">÷</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('*')">×</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('-')">−</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="operator" onclick="append('+')">+</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="square()">x²</button>
<button class="equal" onclick="calculate()">=</button>

<button onclick="sqrt()">√</button>
<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>
<button onclick="tan()">tan</button>

<button onclick="log()">log</button>
<button onclick="ln()">ln</button>
<button onclick="power()">xʸ</button>
<button onclick="pi()">π</button>

</div>

</div>

<script>

let display=document.getElementById("display");

function append(value){

display.value+=value;

}

function clearDisplay(){

display.value="";

}

function deleteLast(){

display.value=display.value.slice(0,-1);

}

function calculate(){

try{

display.value=eval(display.value);

}

catch{

display.value="Error";

}

}

function square(){

display.value=Math.pow(Number(display.value),2);

}

function sqrt(){

display.value=Math.sqrt(Number(display.value));

}

function sin(){

display.value=Math.sin(Number(display.value)*Math.PI/180).toFixed(4);

}

function cos(){

display.value=Math.cos(Number(display.value)*Math.PI/180).toFixed(4);

}

function tan(){

display.value=Math.tan(Number(display.value)*Math.PI/180).toFixed(4);

}

function log(){

display.value=Math.log10(Number(display.value)).toFixed(4);

}

function ln(){

display.value=Math.log(Number(display.value)).toFixed(4);

}

function power(){

let exponent=prompt("Enter Power");

display.value=Math.pow(Number(display.value),Number(exponent));

}

function pi(){

display.value+=Math.PI.toFixed(6);

}

</script>

</body>
</html>

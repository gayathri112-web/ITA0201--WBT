<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:700px;
            background:rgba(255,255,255,0.95);
            padding:35px;
            border-radius:15px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#003366;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        table{
            width:100%;
        }

        td{
            padding:12px;
            vertical-align:top;
        }

        label{
            font-weight:bold;
            color:#003366;
        }

        input[type=text],
        input[type=password],
        input[type=email],
        select,
        textarea{

            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        textarea{
            resize:none;
        }

        .buttons{
            text-align:center;
            margin-top:20px;
        }

        input[type=submit]{
            background:#003366;
            color:white;
            border:none;
            padding:12px 30px;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
            margin-right:10px;
        }

        input[type=reset]{
            background:#777;
            color:white;
            border:none;
            padding:12px 30px;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        input[type=submit]:hover{
            background:#0055aa;
        }

        input[type=reset]:hover{
            background:#555;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<p>Please fill in the details below to complete your registration.</p>

<form>

<table>

<tr>
<td><label>Full Name</label></td>
<td><input type="text" placeholder="Enter your full name"></td>
</tr>

<tr>
<td><label>Email Address</label></td>
<td><input type="email" placeholder="Enter your email"></td>
</tr>

<tr>
<td><label>Password</label></td>
<td><input type="password" placeholder="Enter password"></td>
</tr>

<tr>
<td><label>Gender</label></td>
<td>
<input type="radio" name="gender"> Male
&nbsp;&nbsp;
<input type="radio" name="gender"> Female
&nbsp;&nbsp;
<input type="radio" name="gender"> Other
</td>
</tr>

<tr>
<td><label>Skills</label></td>
<td>
<input type="checkbox"> HTML
&nbsp;
<input type="checkbox"> CSS
&nbsp;
<input type="checkbox"> JavaScript
&nbsp;
<input type="checkbox"> Python
</td>
</tr>

<tr>
<td><label>Department</label></td>
<td>

<select>

<option>Select Department</option>
<option>Information Technology</option>
<option>Computer Science</option>
<option>Artificial Intelligence</option>
<option>Electronics</option>
<option>Mechanical</option>

</select>

</td>
</tr>

<tr>
<td><label>Address</label></td>
<td>

<textarea rows="5" placeholder="Enter your address"></textarea>

</td>
</tr>

</table>

<div class="buttons">

<input type="submit" value="Register">

<input type="reset" value="Clear">

</div>

</form>

</div>

</body>

</html>

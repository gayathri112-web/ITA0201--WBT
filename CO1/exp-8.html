<!DOCTYPE html>
<html>
<head>

<title>Images, Hyperlinks and Iframes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#FAD0C4,#FFD1FF,#C2FFD8,#B5EAEA);
    padding:40px;
}

.container{
    width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0px 10px 25px rgba(0,0,0,0.3);
}

.header{
    background:linear-gradient(to right,#FF512F,#DD2476);
    color:white;
    text-align:center;
    padding:30px;
}

.header h1{
    font-size:38px;
}

.header p{
    margin-top:10px;
    font-size:18px;
}

.section{
    padding:30px;
    text-align:center;
}

h2{
    color:#6A1B9A;
    margin-bottom:15px;
}

img{
    width:420px;
    height:260px;
    border-radius:15px;
    border:5px solid #00BCD4;
    box-shadow:0px 8px 20px rgba(0,0,0,0.25);
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#6A11CB;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:18px;
    transition:0.4s;
}

a:hover{
    background:#2575FC;
    transform:scale(1.08);
}

iframe{
    width:90%;
    height:350px;
    border:5px solid #FF9800;
    border-radius:15px;
    margin-top:20px;
}

.footer{
    background:#6A11CB;
    color:white;
    text-align:center;
    padding:18px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>Images, Hyperlinks and Iframes</h1>
<p>Web Technology Laboratory Experiment</p>
</div>

<div class="section">

<h2>Beautiful Nature Image</h2>

<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
alt="Nature Image" />

</div>

<div class="section">

<h2>Visit OpenAI Website</h2>

<a href="https://openai.com" target="_blank">
Click Here to Visit OpenAI
</a>

</div>

<div class="section">

<h2>Embedded Webpage Using Iframe</h2>

<iframe
src="https://www.wikipedia.org"
title="Wikipedia">
</iframe>

</div>

<div class="footer">
Designed by Gayathri | Images, Hyperlinks & Iframes
</div>

</div>

</body>
</html>
